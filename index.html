<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<title>Endfield Slides · 幻灯片编辑器</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/online.css">
</head>
<body data-mode="editor">
<header class="ed-top">
  <div class="ed-brand"><a href="template.html" title="预览版式">← 版式预览</a><span class="chip">EF</span><b>幻灯片编辑器</b></div>
  <div class="ed-actions">
    <button id="undo" title="撤销 Ctrl+Z">↶ 撤销</button>
    <button id="redo" title="重做 Ctrl+Y">↷ 重做</button>
    <span class="ed-sep"></span>
    <span id="status" class="ed-status">加载中…</span>
    <button id="save" title="Ctrl+S">保存</button>
    <button id="present" class="ed-primary">▶ 从当前页放映</button>
    <a href="assets.html" target="_blank" rel="noopener">素材库</a>
  </div>
</header>

<div class="ed-project"><label>作品名称 <input id="projectName" aria-label="作品名称" maxlength="80" value="我的演示作品"></label><div class="ed-project-actions"><button id="importDeck">导入 HTML</button><button id="exportDeck">导出 HTML</button><button id="newDeck">新建作品</button></div><small>自动保存在当前浏览器；导出文件可离线放映、备份和继续编辑。</small><div class="ed-mobile-tabs"><button data-panel="pages">页面</button><button data-panel="canvas">画布</button><button data-panel="assets">设置与素材</button></div></div>
<div id="warn" class="ed-warn" hidden role="alert"></div>

<div class="ed-body">
  <aside class="ed-pages">
    <div class="ed-pages-head">
      <span>页面</span>
      <button id="addPage" class="ed-primary">＋ 新建</button>
    </div>
    <ol id="thumbs"></ol>
  </aside>

  <main class="ed-stage" id="stageArea">
    <div id="stageWrap"><div id="stage"></div></div>
    <div class="ed-tip">单击文字直接编辑 · 单击图片 / 装饰选中 · 拖动装饰移动，拖右下角缩放 · 把图片文件拖到图片框上可替换</div>
  </main>

  <aside class="ed-panel">
    <section id="selPanel" class="ed-box" hidden></section>
    <section id="pagePanel" class="ed-box"></section>
    <section class="ed-box ed-lib">
      <div class="ed-tabs">
        <button data-tab="deco" class="on">装饰</button>
        <button data-tab="icons">图标</button>
        <button data-tab="comp">组件</button>
      </div>
      <p class="ed-hint">拖进页面，或单击添加到页面中央</p>
      <div id="lib" class="ed-libgrid"></div>
    </section>
  </aside>
</div>

<div id="layoutMenu" class="ed-pop" hidden>
  <div class="ed-pop-head">选择版式 <button id="closeMenu">✕</button></div>
  <div id="layoutList" class="ed-layouts"></div>
</div>

<input type="file" id="fileInput" accept="image/*" hidden>
<script src="js/slides.js"></script>
<input type="file" id="deckInput" accept=".html,text/html" hidden>
<script src="js/online.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
